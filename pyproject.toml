[project]
name = "atom"
version = "0.10.5"
description = "A self-hosted personal AI agent runtime for the terminal and Telegram"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "0sage"},
    {name = "Xubin Ren"},
    {name = "the atom contributors"}
]
keywords = ["ai", "agent", "chatbot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
license-files = [
    "LICENSE",
]

dependencies = [
    "typer>=0.20.0,<1.0.0",
    "anthropic>=0.100.0,<1.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "httpx>=0.28.0,<1.0.0",
    "ddgs>=9.5.5,<10.0.0",
    "oauth-cli-kit>=0.1.6,<1.0.0",
    "loguru>=0.7.3,<1.0.0",
    "readability-lxml>=0.8.4,<1.0.0",
    "lxml-html-clean>=0.4.0,<1.0.0",
    "rich>=14.0.0,<15.0.0",
    "croniter>=6.0.0,<7.0.0",
    "prompt-toolkit>=3.0.50,<4.0.0",
    "questionary>=2.0.0,<3.0.0",
    "mcp>=1.26.0,<2.0.0",
    "json-repair>=0.57.0,<1.0.0",
    "chardet>=3.0.2,<6.0.0",
    "openai>=2.8.0",
    "tiktoken>=0.12.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "dulwich>=0.22.0,<1.0.0",
    "pyyaml>=6.0,<7.0.0",
    "filelock>=3.25.2",
    "watchfiles>=1.1.1,<2.0.0",
    "packaging>=24.0",
    "tzdata>=2025.2",
    "tzlocal>=5.3.1,<6.0.0",
    "defusedxml>=0.7.1,<1.0.0",
    "pypdf>=5.0.0,<6.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "python-pptx>=1.0.0,<2.0.0",
]

# atom installs from the git URL, so these are the only pointers a built
# artifact carries back to the source. Keep this table after every plain
# `[project]` key — a table header absorbs following keys into itself.
[project.urls]
Homepage = "https://github.com/0sage/atom"
Repository = "https://github.com/0sage/atom"
Documentation = "https://github.com/0sage/atom/tree/main/docs"

[project.optional-dependencies]
api = [
    "aiohttp>=3.9.0,<4.0.0",
]
documents = [
    # Compatibility extra: document readers are bundled since v0.2.3.
    "defusedxml>=0.7.1,<1.0.0",
    "pypdf>=5.0.0,<6.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "python-pptx>=1.0.0,<2.0.0",
]
langfuse = [
    "langfuse>=3.0.0,<4.0.0",
]
pdf = [
    # Compatibility extra: PDF reading is bundled since v0.2.3.
    "pypdf>=5.0.0,<6.0.0",
]
olostep = [
    "olostep>=0.1.0; python_version < '3.14'",
]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "aiohttp>=3.9.0,<4.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "pytest-xdist>=3.8.0,<4.0.0",
    "ruff>=0.1.0",
    "basedpyright>=1.39.0,<2.0.0",
    "pymupdf>=1.25.0",
    "pypdf>=5.0.0,<6.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "python-pptx>=1.0.0,<2.0.0",
]

[project.scripts]
atom = "atom.cli.commands:app"

# Third-party tool plugins register here.  Built-in tools are discovered
# automatically via pkgutil scanning in ToolLoader.discover().
# [project.entry-points."atom.tools"]
# my_plugin = "my_package.plugins:MyTool"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
include = [
    "atom/**/*.py",
    "atom/templates/**/*.md",
    "atom/skills/**/*.md",
    "atom/skills/**/*.sh",
]

[tool.hatch.build.targets.wheel]
packages = ["atom"]
exclude = ["atom/channels/*/tests/**"]

[tool.hatch.build.targets.wheel.sources]
"atom" = "atom"

[tool.hatch.build.targets.sdist]
include = [
    "atom/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    # The README opens with a <picture> pointing at ./images and links 15 pages
    # under ./docs. Without both, those references dangle in the packaged
    # artifact. Paths are anchored (they contain a slash) — a bare name like
    # "README.md" above matches at any depth under hatchling's gitignore
    # semantics, which is why docs/README.md ships even without this.
    "images/readme-cover-light.svg",
    "images/readme-cover-dark.svg",
    "docs/",
]
exclude = ["atom/channels/*/tests/**"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.basedpyright]
include = ["atom"]
exclude = ["**/tests"]
typeCheckingMode = "strict"
pythonVersion = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "atom/channels"]

[tool.coverage.run]
source = ["atom"]
omit = ["tests/*", "**/tests/*"]

[tool.coverage.report]
fail_under = 75
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
